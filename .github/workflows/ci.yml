name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests (offline) with coverage
        run: pytest -q --cov=usage_pulse --cov-report=term-missing

      - name: Smoke-test the CLI on generated data
        run: |
          python -m usage_pulse.generate_data --out data/ci_events.csv
          python -m usage_pulse.cli --input data/ci_events.csv
